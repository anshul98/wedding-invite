<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- A&A monogram (small copies of src/assets/images/logo.png, in public/) -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="We're getting married and would love to share this day with you! Follow the link to reveal the date." />

    <!-- Link preview card (WhatsApp, iMessage, Instagram, Facebook, etc.).
         og:image must be a full https:// URL. -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://aishwaryaanshul.site/" />
    <meta property="og:site_name" content="Aishwarya &amp; Anshul" />
    <meta property="og:title" content="Aishwarya &amp; Anshul · Save the Date" />
    <meta property="og:description" content="We're getting married and would love to share this day with you! Follow the link to reveal the date." />
    <meta property="og:image" content="https://aishwaryaanshul.site/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="A &amp; A monogram in gold" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#b0105f" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400;1,600;1,700&family=Great+Vibes&family=Pinyon+Script&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet" />
    <!-- Shown instantly, before the app's code downloads (slow networks): pink screen + pulsing heart.
         Same look as the first screen and its loader; disappears as soon as the app draws. -->
    <style>
      html, body { background: #b0105f; }
      #root:empty {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background:
          radial-gradient(circle at 50% 40%, rgba(255, 255, 255, 0.18) 0%, transparent 60%),
          linear-gradient(180deg, #d81b7a 0%, #b0105f 50%, #8a0a4a 100%);
      }
      #root:empty::before {
        content: '\2665';
        font-size: 2.6rem;
        color: rgba(255, 255, 255, 0.9);
        animation: boot-pulse 1.1s ease-in-out infinite;
      }
      @keyframes boot-pulse {
        0%, 100% { transform: scale(0.85); opacity: 0.6; }
        50% { transform: scale(1.1); opacity: 1; }
      }
    </style>
    <title>Aishwarya &amp; Anshul · Save the Date</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
